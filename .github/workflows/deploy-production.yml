name: Deploy to Azure Production (West Europe)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: '18'
  AZURE_RESOURCE_GROUP: runcoach-rg
  AZURE_REGION: westeurope
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  # Backend deployment
  deploy-backend:
    name: Deploy Backend to Azure App Service
    runs-on: ubuntu-latest
    environment: Prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run tests
        working-directory: ./backend
        run: npm test || echo "No tests configured"

      - name: Build backend
        working-directory: ./backend
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run build

      - name: Create deployment package
        working-directory: ./backend
        run: |
          mkdir -p deploy
          cp -r dist package.json package-lock.json deploy/
          if [ -d migrations ]; then cp -r migrations deploy/; fi
          cd deploy
          # Install production dependencies in the deploy folder
          npm ci --omit=dev
          zip -r ../backend-deploy.zip .

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_BACKEND_APP_NAME }}
          package: ./backend/backend-deploy.zip

      - name: Azure logout
        run: az logout || true
        if: always()

  # Agent Service deployment
  deploy-agent:
    name: Deploy Agent Service to Azure App Service
    runs-on: ubuntu-latest
    environment: Prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ./agent-service
        run: npm ci

      - name: Build agent service
        working-directory: ./agent-service
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run build

      - name: Create deployment package
        working-directory: ./agent-service
        run: |
          mkdir -p deploy
          cp -r dist package.json package-lock.json deploy/
          cd deploy
          # Install production dependencies in the deploy folder
          npm ci --omit=dev
          zip -r ../agent-deploy.zip .

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_AGENT_APP_NAME }}
          package: ./agent-service/agent-deploy.zip

      - name: Azure logout
        run: az logout || true
        if: always()

  # Frontend deployment
  deploy-frontend:
    name: Deploy Frontend to Azure App Service
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    environment: Prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_STRAVA_CLIENT_ID: ${{ secrets.VITE_STRAVA_CLIENT_ID }}
        run: npm run build

      - name: Create deployment package
        working-directory: ./frontend
        run: |
          cd dist
          zip -r ../frontend-deploy.zip .

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_FRONTEND_APP_NAME }}
          package: ./frontend/frontend-deploy.zip

      - name: Azure logout
        run: az logout || true
        if: always()

  # Post-deployment health check with retries
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend, deploy-agent]
    environment: Prod

    steps:
      - name: Wait for deployment to stabilize
        run: sleep 30

      - name: Check backend health (retry)
        run: |
          set -e
          url="${{ secrets.BACKEND_URL }}/health"
          echo "Checking: $url"

          # Try for up to 3 minutes (18 * 10s)
          for i in $(seq 1 18); do
            code=$(curl -s -o /tmp/backend_health_body.txt -w "%{http_code}" "$url" || true)
            if [ "$code" = "200" ]; then
              echo "Backend health check passed"
              cat /tmp/backend_health_body.txt || true
              exit 0
            fi

            echo "Attempt $i: Backend health returned HTTP $code"
            echo "Response body (if any):"
            tail -c 2000 /tmp/backend_health_body.txt || true
            sleep 10
          done

          echo "Backend health check failed after retries"
          exit 1

      - name: Check agent service health (retry)
        run: |
          set -e
          url="${{ secrets.AGENT_URL }}/health"
          echo "Checking: $url"

          # Try for up to 5 minutes (30 * 10s) - agent takes longer to warm up
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/agent_health_body.txt -w "%{http_code}" "$url" || true)
            if [ "$code" = "200" ]; then
              echo "Agent service health check passed"
              cat /tmp/agent_health_body.txt || true
              exit 0
            fi

            echo "Attempt $i: Agent health returned HTTP $code"
            echo "Response body (if any):"
            tail -c 2000 /tmp/agent_health_body.txt || true
            sleep 10
          done

          echo "Agent service health check failed after retries"
          exit 1

      - name: Check frontend (retry)
        run: |
          set -e
          url="${{ secrets.FRONTEND_URL }}"
          echo "Checking: $url"

          # Try for up to 2 minutes (12 * 10s)
          for i in $(seq 1 12); do
            code=$(curl -s -o /tmp/frontend_body.txt -w "%{http_code}" "$url" || true)
            if [ "$code" = "200" ]; then
              echo "Frontend health check passed"
              exit 0
            fi

            echo "Attempt $i: Frontend returned HTTP $code"
            sleep 10
          done

          echo "Frontend health check failed after retries"
          exit 1

      - name: Notify deployment success
        if: success()
        run: |
          echo "Deployment successful to West Europe!"
          echo "Backend: ${{ secrets.BACKEND_URL }}"
          echo "Agent: ${{ secrets.AGENT_URL }}"
          echo "Frontend: ${{ secrets.FRONTEND_URL }}"
