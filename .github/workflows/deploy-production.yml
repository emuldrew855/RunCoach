name: Deploy to Azure Production (West Europe)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: '18'
  AZURE_RESOURCE_GROUP: runcoach-rg
  AZURE_REGION: westeurope

jobs:
  # Backend deployment
  deploy-backend:
    name: Deploy Backend to Azure App Service
    runs-on: ubuntu-latest
    environment: Prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run tests
        working-directory: ./backend
        run: npm test || echo "No tests configured"

      - name: Build backend
        working-directory: ./backend
        run: npm run build

      - name: Create deployment package
        working-directory: ./backend
        run: |
          mkdir -p deploy
          cp -r dist node_modules package.json package-lock.json deploy/
          if [ -d migrations ]; then cp -r migrations deploy/; fi
          cd deploy
          zip -r ../backend-deploy.zip .

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_BACKEND_APP_NAME }}
          package: ./backend/backend-deploy.zip

      - name: Azure logout
        run: az logout || true
        if: always()

  # Agent Service deployment
  deploy-agent:
    name: Deploy Agent Service to Azure App Service
    runs-on: ubuntu-latest
    environment: Prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ./agent-service
        run: npm ci

      - name: Build agent service
        working-directory: ./agent-service
        run: npm run build

      - name: Create deployment package
        working-directory: ./agent-service
        run: |
          mkdir -p deploy
          cp -r dist node_modules package.json package-lock.json deploy/
          cd deploy
          zip -r ../agent-deploy.zip .

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_AGENT_APP_NAME }}
          package: ./agent-service/agent-deploy.zip

      - name: Azure logout
        run: az logout || true
        if: always()

  # Frontend deployment
  deploy-frontend:
    name: Deploy Frontend to Azure Static Web Apps
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    environment: Prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_STRAVA_CLIENT_ID: ${{ secrets.VITE_STRAVA_CLIENT_ID }}
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '/frontend'
          output_location: 'dist'
          skip_app_build: true

  # Post-deployment health check
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend, deploy-agent]
    environment: Prod

    steps:
      - name: Wait for deployment to stabilize
        run: sleep 60

      - name: Check backend health
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.BACKEND_URL }}/health)
          if [ $response -eq 200 ]; then
            echo "Backend health check passed"
          else
            echo "Backend health check failed (HTTP $response)"
            exit 1
          fi

      - name: Check agent service health
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.AGENT_URL }}/health)
          if [ $response -eq 200 ]; then
            echo "Agent service health check passed"
          else
            echo "Agent service health check failed (HTTP $response)"
            exit 1
          fi

      - name: Check frontend
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.FRONTEND_URL }})
          if [ $response -eq 200 ]; then
            echo "Frontend health check passed"
          else
            echo "Frontend health check failed (HTTP $response)"
            exit 1
          fi

      - name: Notify deployment success
        if: success()
        run: |
          echo "Deployment successful to West Europe!"
          echo "Backend: ${{ secrets.BACKEND_URL }}"
          echo "Agent: ${{ secrets.AGENT_URL }}"
          echo "Frontend: ${{ secrets.FRONTEND_URL }}"
