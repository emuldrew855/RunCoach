name: Deploy isolated MCP to Azure

on:
  push:
    branches: [main, master]
    paths:
      - 'mcp-server/**'
      - 'infra/mcp.bicep'
      - '.github/workflows/deploy-mcp.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-mcp-production
  cancel-in-progress: false

jobs:
  deploy-mcp:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: ProdMcp
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mcp_test
          POSTGRES_PASSWORD: mcp-ci-test-only
          POSTGRES_DB: mcp_shared_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcp_test -d mcp_shared_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AZURE_MCP_CLIENT_ID: ${{ secrets.AZURE_MCP_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_MCP_APP_NAME: ${{ secrets.AZURE_MCP_APP_NAME }}
      MCP_PUBLIC_URL: ${{ secrets.MCP_PUBLIC_URL }}
      STRAVA_CLIENT_ID: ${{ vars.STRAVA_CLIENT_ID }}
      MCP_CLIENT_ID: ${{ vars.MCP_CLIENT_ID }}
      MCP_POSTGRES_HOST: ${{ vars.MCP_POSTGRES_HOST }}
    steps:
      - name: Validate protected environment configuration
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const names = ['AZURE_MCP_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID',
            'AZURE_MCP_APP_NAME', 'MCP_PUBLIC_URL', 'STRAVA_CLIENT_ID', 'MCP_CLIENT_ID', 'MCP_POSTGRES_HOST'];
          for (const name of names) {
            if (!process.env[name]?.trim()) {
              console.error(`::error::Missing ProdMcp configuration: ${name}`);
              process.exit(1);
            }
          }
          for (const name of ['AZURE_MCP_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID']) {
            if (!/^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(process.env[name])) {
              console.error(`::error::Invalid Azure ID: ${name}`);
              process.exit(1);
            }
          }
          let validOrigin = false;
          try {
            const url = new URL(process.env.MCP_PUBLIC_URL);
            validOrigin = url.protocol === 'https:' && url.origin === process.env.MCP_PUBLIC_URL;
          } catch {}
          if (!/^[a-z0-9][a-z0-9-]{1,58}[a-z0-9]$/i.test(process.env.AZURE_MCP_APP_NAME) || !validOrigin) {
            console.error('::error::Invalid MCP app name or HTTPS origin');
            process.exit(1);
          }
          if (!/^[a-z0-9-]+\.postgres\.database\.azure\.com$/.test(process.env.MCP_POSTGRES_HOST)) {
            console.error('::error::Invalid dedicated MCP PostgreSQL host');
            process.exit(1);
          }
          NODE

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and validate MCP
        working-directory: mcp-server
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: mcp_test
          PGPASSWORD: mcp-ci-test-only
          MCP_TEST_DATABASE_URL: postgresql://127.0.0.1:5432/mcp_shared_test
          MCP_STORAGE_TEST_DATABASE_URL: postgresql://127.0.0.1:5432/mcp_storage_test
          MCP_STANDALONE_TEST_DATABASE_URL: postgresql://127.0.0.1:5432/mcp_standalone_test
          MCP_STARTUP_TEST_DATABASE_URL: postgresql://127.0.0.1:5432/mcp_startup_test
        run: |
          set -euo pipefail
          npm ci
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const pool = new pg.Pool({ connectionString: process.env.MCP_TEST_DATABASE_URL });
          try {
            // Separate disposable fixtures: never connect tests to Azure PostgreSQL.
            for (const name of ['mcp_storage_test', 'mcp_standalone_test', 'mcp_startup_test']) {
              await pool.query(`CREATE DATABASE ${name}`);
            }
          } finally {
            await pool.end();
          }
          NODE
          # The packaged startup fixture intentionally inherits only its URL, not PG*.
          export MCP_STARTUP_TEST_DATABASE_URL="$(node --input-type=module -e 'const url = new URL(process.env.MCP_STARTUP_TEST_DATABASE_URL); url.username = process.env.PGUSER; url.password = process.env.PGPASSWORD; process.stdout.write(url.href);')"
          npm test -- --test-concurrency=1
          npm run check

      - name: Package code and production dependencies only
        working-directory: mcp-server
        run: |
          set -euo pipefail
          mkdir -p deploy/schema
          cp package.json package-lock.json schema.sql deploy/
          cp -r src deploy/
          cp schema/tools.json deploy/schema/
          cd deploy
          npm ci --omit=dev
          # The explicit allowlist excludes .env, tests, and full-stack code.
          zip -qr ../mcp-deploy.zip src schema schema.sql package.json package-lock.json node_modules

      - name: Azure OIDC login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_MCP_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify dedicated target and persisted runtime settings
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          // Keep credentials in memory; never print or write Azure app settings.
          function azureJson(args) {
            try {
              return JSON.parse(execFileSync('az', args, {
                encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'], timeout: 60000,
              }));
            } catch {
              console.error('::error::Unable to read dedicated MCP deployment configuration');
              process.exit(1);
            }
          }
          const scope = ['--resource-group', 'runcoach-prod-rg', '--name', process.env.AZURE_MCP_APP_NAME];
          const target = azureJson(['webapp', 'show', ...scope,
            '--query', '{host:defaultHostName,httpsOnly:httpsOnly}', '--output', 'json']);
          const settings = Object.fromEntries(azureJson(['webapp', 'config', 'appsettings', 'list',
            ...scope, '--output', 'json']).map(x => [x.name, x.value]));
          const expected = {
            MCP_PUBLIC_URL: process.env.MCP_PUBLIC_URL,
            MCP_CLIENT_ID: process.env.MCP_CLIENT_ID,
            STRAVA_CLIENT_ID: process.env.STRAVA_CLIENT_ID,
            STRAVA_CREDENTIAL_STORE: 'standalone',
            TRUSTED_PROXY_MODE: 'azure-app-service',
            HOST: '0.0.0.0',
            NODE_ENV: 'production',
            STRAVA_REDIRECT_URI: `${process.env.MCP_PUBLIC_URL}/strava/callback`,
          };
          if (!target.httpsOnly || `https://${target.host}` !== process.env.MCP_PUBLIC_URL ||
              Object.entries(expected).some(([key, value]) => settings[key] !== value) ||
              !['DATABASE_URL', 'MCP_CLIENT_SECRET', 'STRAVA_CLIENT_SECRET', 'MCP_REDIRECT_URIS'].every(key => settings[key])) {
            console.error('::error::Target does not match the bootstrapped standalone MCP runtime');
            process.exit(1);
          }
          const key = settings.MCP_CREDENTIAL_ENCRYPTION_KEY || '';
          const decoded = Buffer.from(key, 'base64');
          let verifiedTls = false;
          try {
            const database = new URL(settings.DATABASE_URL);
            verifiedTls = database.protocol === 'postgresql:' && database.pathname === '/runcoach_mcp' &&
              database.hostname === process.env.MCP_POSTGRES_HOST &&
              database.searchParams.get('sslmode') === 'verify-full';
          } catch {}
          if (decoded.length !== 32 || decoded.toString('base64') !== key || !verifiedTls) {
            console.error('::error::Invalid persistent credential encryption or database TLS configuration');
            process.exit(1);
          }
          NODE

      - name: Deploy MCP ZIP
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_MCP_APP_NAME }}
          package: mcp-server/mcp-deploy.zip

      - name: Verify health, OAuth discovery, and unauthenticated MCP challenge
        shell: bash
        run: |
          set -euo pipefail
          sleep 30
          node --input-type=module <<'NODE'
          const base = process.env.MCP_PUBLIC_URL;
          let healthy = false;
          for (let attempt = 0; attempt < 30; attempt++) {
            try {
              const response = await fetch(`${base}/health`, { signal: AbortSignal.timeout(20000), redirect: 'error' });
              healthy = response.ok && (await response.json()).status === 'ok';
            } catch {}
            if (healthy) break;
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          if (!healthy) throw new Error('MCP startup/health failed; inspect startup and migration logs');
          async function discovery(path) {
            const response = await fetch(`${base}${path}`, { signal: AbortSignal.timeout(20000), redirect: 'error' });
            if (!response.ok) throw new Error('OAuth discovery unavailable');
            return response.json();
          }
          const auth = await discovery('/.well-known/oauth-authorization-server');
          const resource = await discovery('/.well-known/oauth-protected-resource/mcp');
          if (auth.issuer !== base || auth.authorization_endpoint !== `${base}/oauth/authorize` ||
              auth.token_endpoint !== `${base}/oauth/token` ||
              !auth.code_challenge_methods_supported?.includes('S256') ||
              resource.resource !== `${base}/mcp` || !resource.authorization_servers?.includes(base)) {
            throw new Error('Incorrect OAuth discovery metadata');
          }
          const response = await fetch(`${base}/mcp`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}',
            signal: AbortSignal.timeout(20000), redirect: 'error',
          });
          const challenge = response.headers.get('www-authenticate') || '';
          if (response.status !== 401 || !challenge.startsWith('Bearer ') ||
              !challenge.includes(`resource_metadata="${base}/.well-known/oauth-protected-resource/mcp"`)) {
            throw new Error('Unauthenticated MCP request did not return its resource challenge');
          }
          console.log('MCP health, discovery, and resource authentication checks passed');
          NODE

      - name: Azure logout
        if: always()
        shell: bash
        run: |
          az logout || true
