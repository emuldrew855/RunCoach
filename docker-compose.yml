version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: runcoach-postgres
    environment:
      POSTGRES_DB: runcoach
      POSTGRES_USER: runcoach
      POSTGRES_PASSWORD: runcoach
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runcoach"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
